name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[mcp,langchain]" pytest build
      - name: Run Python tests
        run: python -m pytest -v
      - name: Build and smoke-test the distributable wheel
        run: |
          python -m build
          python -m venv /tmp/asm-wheel-smoke
          wheel=$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name 'asm_protocol-*.whl' -print -quit)
          /tmp/asm-wheel-smoke/bin/python -m pip install "${wheel}[langchain]" "mcp>=2,<3"
          /tmp/asm-wheel-smoke/bin/python -c \
            "from asm_protocol.integrations.langchain import ASMToolSelectorTool; assert ASMToolSelectorTool().name == 'asm_tool_selector'"
          cd /tmp
          /tmp/asm-wheel-smoke/bin/asm-lint \
            "$GITHUB_WORKSPACE/examples/mcp-server-json/remote-with-asm.server.json" \
            --format json --as-of 2026-05-20
          test -x /tmp/asm-wheel-smoke/bin/asm-selector

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: registry/package-lock.json
      - name: Install registry dependencies
        working-directory: registry
        run: npm ci
      - name: Type-check and build
        working-directory: registry
        run: npm run build
      - name: Run registry tests
        working-directory: registry
        run: npm test

  deepseek-harness-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json
      - name: Install plugin dependencies
        working-directory: integrations/deepseek-harness
        run: npm ci
      - name: Build, test, and inspect the package
        working-directory: integrations/deepseek-harness
        run: npm run check

  dsh-selection-fixture-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fixture test dependencies
        run: python -m pip install -e . pytest
      - name: Verify generated fixture is checkout-stable
        run: python tools/build_dsh_selection_fixture.py --check
      - name: Run focused conformance tests
        run: python -m pytest -q tools/asm-gen/test_dsh_selection_fixture.py

  dsh-guarded-hcl-asm-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/interop/deepseek-harness-guarded-evidence/package-lock.json
      - name: Install the pinned independent contract consumer
        working-directory: examples/interop/deepseek-harness-guarded-evidence
        run: npm ci --ignore-scripts
      - name: Verify generated identities and mutation matrix
        working-directory: examples/interop/deepseek-harness-guarded-evidence
        run: npm run check
