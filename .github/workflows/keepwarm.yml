# Keeps the public API instance from sleeping.
#
# Why: the free hosting tier sleeps after ~15 minutes idle, and waking it is slow
# and unreliable — a cold instance can refuse to answer for several minutes before
# it comes back. The README "Try it" endpoint and the catalog URL referenced from
# spec discussions both live on that host, so a visitor's first request is the one
# most likely to time out.
#
# Cost: none. Scheduled Actions are free on public repositories.
#
# Known limits: GitHub's cron can drift under load, and scheduled workflows are
# disabled automatically after 60 days without repository activity.

name: keep-warm

on:
  schedule:
    # Every 10 minutes — the instance sleeps at 15, so this leaves headroom.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /healthz until the instance answers
        env:
          URL: https://asm-spec.onrender.com/healthz
        run: |
          set -u
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "attempt $i: HTTP 200 -> $(cat /tmp/body.txt)"
              exit 0
            fi
            echo "attempt $i: HTTP $code (still waking)"
            sleep 20
          done
          echo "::warning title=Instance did not wake::6 attempts, no 200 from $URL"
          # Deliberately not failing: a slow wake is not a code defect, and a red X
          # on every cold miss would train us to ignore this workflow. Change the
          # line below to `exit 1` if you want hard alerting instead.
          exit 0
