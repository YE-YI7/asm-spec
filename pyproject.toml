[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-protocol"
version = "0.5.0"
description = "Agent Service Manifest: value metadata and scoring for autonomous service selection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yi Guo" }]
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
asm = "asm_cli:main"
asm-mcp-validate = "mcp_server_json_asm:main"
asm-select-api = "asm_select_api:main"

[tool.setuptools]
py-modules = ["asm_cli", "mcp_server_json_asm", "openrouter_adapter", "library_select", "asm_selector_mcp", "asm_select_api"]
packages = ["scorer"]

[tool.setuptools.package-data]
scorer = ["data/*.json"]
