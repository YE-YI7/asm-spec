[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asm-protocol"
dynamic = ["version"]
description = "Agent Service Manifest: value metadata and scoring for autonomous service selection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yi Guo" }]
dependencies = [
  "jsonschema>=4.0",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
langchain = ["langchain-core>=0.3"]

[project.scripts]
asm = "asm_cli:main"
asm-mcp-validate = "mcp_server_json_asm:main"
asm-lint = "asm_lint:main"
asm-select-api = "asm_select_api:main"
asm-selector = "asm_selector_mcp:main"

[tool.setuptools]
py-modules = ["asm_cli", "asm_lint", "mcp_server_json_asm", "openrouter_adapter", "library_select", "asm_selector_mcp", "asm_select_api", "_asm_library_data"]
packages = [
  "asm_protocol",
  "asm_protocol.federation",
  "asm_protocol.integrations",
  "asm_protocol.providers",
  "scorer",
  "scorer.data",
  "asm_schema",
  "asm_public",
  "asm_public.methods",
  "asm_public.runs",
  "asm_public.services",
]

[tool.setuptools.package-dir]
asm_protocol = "src/asm_protocol"
asm_schema = "schema"
asm_public = "public"

[tool.setuptools.dynamic]
version = {attr = "asm_protocol.version.__version__"}

[tool.setuptools.package-data]
scorer = ["data/*.json"]
asm_schema = ["*.json"]
asm_public = ["*.html", "*.json", "*.css"]
"asm_public.methods" = ["*.html"]
"asm_public.runs" = ["*.html"]
"asm_public.services" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["scorer", "tools/asm-gen"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]
